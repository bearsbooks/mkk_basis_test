# Конфигурация Alembic: расположение скриптов миграций и подключение по умолчанию.
# URL подключения подставляется в alembic/env.py из переменной окружения DATABASE_URL
# или аргумента `-x db_url=...` (используется в тестах).

[alembic]
script_location = alembic
prepend_sys_path = .
# Значение по умолчанию; в реальном запуске перекрывается DATABASE_URL.
sqlalchemy.url = postgresql+asyncpg://mkk:mkk@localhost:5432/mkk_payments

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
